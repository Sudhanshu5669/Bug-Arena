<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bug Arena — Live Preview</title>
    <style>
      :root {
        --bg: #0b0e14;
        --panel: #141924;
        --panel-2: #1b2130;
        --line: #262d3d;
        --text: #e6e9ef;
        --muted: #8b93a7;
        --a: #4ea1ff;
        --b: #ff5d73;
        --accent: #7bd88f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        max-width: 1360px;
        margin: 0 auto;
        padding: 16px;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      header h1 { margin: 0; font-size: 20px; letter-spacing: 0.3px; }
      header .sub { color: var(--muted); font-size: 13px; }
      .stage {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        display: block;
        border-radius: 8px;
        background: #0a0806;
      }
      .overlay {
        position: absolute;
        inset: 12px;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        background: rgba(6, 8, 12, 0.82);
        border-radius: 8px;
        text-align: center;
      }
      .overlay.show { display: flex; }
      .overlay h2 { margin: 0; font-size: 28px; }
      .overlay p { margin: 0; color: var(--muted); }
      .side { display: flex; flex-direction: column; gap: 12px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .card h3 {
        margin: 0 0 10px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--muted);
      }
      .scorebar { display: flex; align-items: center; gap: 10px; }
      .scorebar .n { font-size: 26px; font-weight: 700; min-width: 34px; text-align: center; }
      .scorebar .n.a { color: var(--a); }
      .scorebar .n.b { color: var(--b); }
      .bar { flex: 1; height: 10px; border-radius: 6px; overflow: hidden; background: var(--b); display: flex; }
      .bar > i { display: block; height: 100%; background: var(--a); transition: width 0.2s; }
      .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 8px; }
      .roster { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .roster .team-col h4 { margin: 0 0 6px; font-size: 12px; }
      .roster .team-col.a h4 { color: var(--a); }
      .roster .team-col.b h4 { color: var(--b); }
      .sp-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 3px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,0.4); }
      .sp-row .cnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
      .feed { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
      .feed .line { font-size: 12px; color: var(--muted); }
      .feed .line b { color: var(--text); font-weight: 600; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; }
      button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { border-color: #3a445c; }
      button.primary { background: var(--accent); color: #06210f; border-color: transparent; font-weight: 600; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .seg button { border: none; border-radius: 0; }
      .seg button.active { background: var(--a); color: #04121f; }
      .status-pill { font-size: 11px; color: var(--muted); }
      @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>🐛 Bug Arena</h1>
        <span class="sub">live simulation preview — engine runs headless in Node, this is just a renderer</span>
      </header>

      <div class="stage">
        <canvas id="arena" width="1280" height="720"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlay-title">Battle Over</h2>
          <p id="overlay-sub"></p>
        </div>
      </div>

      <div class="side">
        <div class="card">
          <h3>Survivors</h3>
          <div class="scorebar">
            <span class="n a" id="score-a">0</span>
            <span class="bar"><i id="bar-a" style="width: 50%"></i></span>
            <span class="n b" id="score-b">0</span>
          </div>
          <div class="meta">
            <span id="meta-time">0.0s</span>
            <span class="status-pill" id="meta-status">connecting…</span>
            <span id="meta-mode">—</span>
          </div>
        </div>

        <div class="card">
          <h3>Rosters</h3>
          <div class="roster">
            <div class="team-col a"><h4>Team A</h4><div id="roster-a"></div></div>
            <div class="team-col b"><h4>Team B</h4><div id="roster-b"></div></div>
          </div>
        </div>

        <div class="card">
          <h3>Abilities <span style="text-transform:none;letter-spacing:0;color:#5c6377">(debug — cooldowns)</span></h3>
          <div id="abilities"></div>
        </div>

        <div class="card">
          <h3>Event Feed</h3>
          <div class="feed" id="feed"></div>
        </div>

        <div class="card">
          <h3>Controls</h3>
          <div class="controls">
            <button class="primary" id="btn-new">New Battle</button>
            <span class="seg">
              <button id="mode-agg" class="active">Aggressive</button>
              <button id="mode-pass">Passive</button>
            </span>
          </div>
          <div class="meta"><span id="meta-seed">seed —</span></div>
        </div>
      </div>
    </div>

    <script type="module" src="/client.js"></script>
  </body>
</html>
