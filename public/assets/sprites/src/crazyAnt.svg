<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Crazy Ant — top-down, facing up. Tiny, acid-yellow and visibly unstable:
       legs splayed at odd, non-mirrored angles, extra-long antennae, and a chemical
       gland glowing through the gaster with acid beading at the tip. -->
  <defs>
    <radialGradient id="crGaster" cx="42%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#e8f27a"/>
      <stop offset="50%" stop-color="#b8c43a"/>
      <stop offset="100%" stop-color="#4e5410"/>
    </radialGradient>
    <radialGradient id="crBody" cx="42%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#c8d24a"/>
      <stop offset="100%" stop-color="#454a0e"/>
    </radialGradient>
    <radialGradient id="crHaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(210,235,80,0.34)"/>
      <stop offset="100%" stop-color="rgba(210,235,80,0)"/>
    </radialGradient>
  </defs>

  <!-- acrid haze around it -->
  <circle cx="64" cy="82" r="32" fill="url(#crHaze)"/>

  <!-- legs — deliberately NOT mirrored, so the stance reads as erratic -->
  <g fill="none" stroke="#3c4210" stroke-width="2.5" stroke-linecap="round">
    <path d="M56 58 Q37 48 24 40"/>
    <path d="M56 66 Q36 68 21 64"/>
    <path d="M56 74 Q39 85 30 98"/>
    <path d="M72 58 Q92 52 106 46"/>
    <path d="M72 66 Q93 63 108 70"/>
    <path d="M72 74 Q88 82 96 96"/>
  </g>
  <!-- very long, whipping antennae -->
  <g fill="none" stroke="#3c4210" stroke-width="2.2" stroke-linecap="round">
    <path d="M59 38 Q46 26 38 12"/>
    <path d="M69 38 Q82 28 92 18"/>
  </g>

  <!-- body: small head, narrow thorax, bulb of a gaster -->
  <ellipse cx="64" cy="88" rx="12" ry="15" fill="url(#crGaster)" stroke="#3c4210" stroke-width="2.8"/>
  <ellipse cx="64" cy="64" rx="7.5" ry="9.5" fill="url(#crBody)" stroke="#3c4210" stroke-width="2.8"/>
  <circle cx="64" cy="44" r="8" fill="url(#crBody)" stroke="#3c4210" stroke-width="2.8"/>

  <!-- the acid gland glowing inside the gaster -->
  <ellipse cx="64" cy="92" rx="6.5" ry="8" fill="#f4ffa0" opacity="0.75"/>
  <circle cx="61" cy="86" r="2.4" fill="#ffffff" opacity="0.5"/>

  <!-- acid beading at the gaster tip and dripping -->
  <circle cx="64" cy="104" r="3" fill="#e2f45c" opacity="0.9"/>
  <circle cx="64" cy="112" r="1.9" fill="#e2f45c" opacity="0.6"/>
  <circle cx="65" cy="119" r="1.2" fill="#e2f45c" opacity="0.4"/>

  <!-- thin mandibles -->
  <g fill="none" stroke="#3c4210" stroke-width="2" stroke-linecap="round">
    <path d="M60 38 Q57 33 58 30"/>
    <path d="M68 38 Q71 33 70 30"/>
  </g>

  <!-- eyes, set slightly askew -->
  <circle cx="60" cy="44" r="1.9" fill="#232806"/>
  <circle cx="68" cy="43" r="1.9" fill="#232806"/>
  <circle cx="60.6" cy="43.3" r="0.75" fill="#f4ffc0" opacity="0.85"/>
</svg>
