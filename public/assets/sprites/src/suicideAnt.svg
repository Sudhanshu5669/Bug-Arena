<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Suicide Ant — top-down, facing up. Frail body, but a swollen abdomen bulging
       with green toxin, ready to rupture. Source art; rendered directly from SVG. -->
  <defs>
    <radialGradient id="saGaster" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#d7f79a"/>
      <stop offset="45%" stop-color="#8fd048"/>
      <stop offset="100%" stop-color="#39631a"/>
    </radialGradient>
    <radialGradient id="saThorax" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#9fd257"/>
      <stop offset="100%" stop-color="#3f5f1c"/>
    </radialGradient>
    <radialGradient id="saHead" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#a6d95f"/>
      <stop offset="100%" stop-color="#3a5a18"/>
    </radialGradient>
    <radialGradient id="saGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(150,240,90,0.45)"/>
      <stop offset="100%" stop-color="rgba(150,240,90,0)"/>
    </radialGradient>
  </defs>

  <!-- toxic haze around the volatile abdomen -->
  <circle cx="64" cy="94" r="34" fill="url(#saGlow)"/>

  <!-- spindly legs + antennae (thin — it's fragile) -->
  <g fill="none" stroke="#274012" stroke-width="3" stroke-linecap="round">
    <g id="saLimbs">
      <path d="M57 54 Q40 47 28 38"/>
      <path d="M57 60 Q39 60 27 61"/>
      <path d="M57 66 Q41 75 31 86"/>
      <path d="M60 33 Q54 22 50 13"/>
    </g>
    <use href="#saLimbs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- thin mandibles -->
  <g fill="none" stroke="#274012" stroke-width="2.2" stroke-linecap="round">
    <path d="M60 30 Q56 25 52 24"/>
    <path d="M68 30 Q72 25 76 24"/>
  </g>

  <!-- body: small head + narrow thorax, then a huge swollen gaster -->
  <ellipse cx="64" cy="93" rx="17" ry="22" fill="url(#saGaster)" stroke="#274012" stroke-width="3"/>
  <ellipse cx="64" cy="61" rx="9" ry="11" fill="url(#saThorax)" stroke="#274012" stroke-width="3"/>
  <circle cx="64" cy="39" r="9.5" fill="url(#saHead)" stroke="#274012" stroke-width="3"/>

  <!-- toxin bubbles inside the abdomen -->
  <circle cx="58" cy="88" r="4.5" fill="#e6ffb0" opacity="0.75"/>
  <circle cx="70" cy="96" r="3.5" fill="#e6ffb0" opacity="0.6"/>
  <circle cx="63" cy="101" r="2.6" fill="#e6ffb0" opacity="0.55"/>
  <path d="M50 90 Q64 98 78 90" fill="none" stroke="#2f4a12" stroke-width="1.8" opacity="0.45"/>

  <!-- eyes -->
  <circle cx="60" cy="39" r="2.1" fill="#1f3308"/>
  <circle cx="68" cy="39" r="2.1" fill="#1f3308"/>
  <circle cx="60.6" cy="38.3" r="0.8" fill="#eaffc4" opacity="0.85"/>
</svg>
