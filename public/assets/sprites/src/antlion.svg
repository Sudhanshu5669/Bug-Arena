<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Antlion (larva) — top-down, facing up. Squat, sand-coloured and half buried:
       a ring of sunken sand around it, a bristled humped body, and the enormous
       curved sickle jaws it waits at the bottom of the pit with. -->
  <defs>
    <radialGradient id="alBody" cx="40%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#d8c39a"/>
      <stop offset="50%" stop-color="#a8906a"/>
      <stop offset="100%" stop-color="#4a3c26"/>
    </radialGradient>
    <radialGradient id="alHead" cx="40%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#c9b287"/>
      <stop offset="100%" stop-color="#40331f"/>
    </radialGradient>
    <radialGradient id="alPit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(70,52,28,0.42)"/>
      <stop offset="70%" stop-color="rgba(110,88,52,0.16)"/>
      <stop offset="100%" stop-color="rgba(140,116,74,0)"/>
    </radialGradient>
  </defs>

  <!-- the sunken sand pit it sits in -->
  <circle cx="64" cy="72" r="56" fill="url(#alPit)"/>
  <g fill="none" stroke="#6b5738" stroke-width="1.2" opacity="0.32">
    <circle cx="64" cy="72" r="50"/>
    <circle cx="64" cy="72" r="40"/>
    <circle cx="64" cy="72" r="30"/>
  </g>

  <!-- stubby legs, mostly buried -->
  <g fill="none" stroke="#33291a" stroke-width="4" stroke-linecap="round">
    <g id="alLegs">
      <path d="M52 68 Q38 66 30 60"/>
      <path d="M53 80 Q40 82 32 88"/>
    </g>
    <use href="#alLegs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- humped, segmented abdomen -->
  <ellipse cx="64" cy="84" rx="21" ry="24" fill="url(#alBody)" stroke="#33291a" stroke-width="3.4"/>
  <g fill="none" stroke="#4a3c26" stroke-width="2.2" opacity="0.55">
    <path d="M45 78 Q64 86 83 78"/>
    <path d="M46 90 Q64 98 82 90"/>
    <path d="M51 101 Q64 108 77 101"/>
  </g>
  <!-- bristles along the flanks -->
  <g fill="none" stroke="#5c4a2e" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <path d="M44 74 L38 70"/><path d="M43 86 L36 85"/><path d="M46 97 L40 100"/>
    <path d="M84 74 L90 70"/><path d="M85 86 L92 85"/><path d="M82 97 L88 100"/>
  </g>
  <ellipse cx="54" cy="74" rx="6" ry="9" fill="#ffeec8" opacity="0.18" transform="rotate(-20 54 74)"/>

  <!-- flat head, set forward of the hump -->
  <ellipse cx="64" cy="52" rx="13" ry="10" fill="url(#alHead)" stroke="#33291a" stroke-width="3.2"/>

  <!-- THE JAWS: huge opposed sickles, the whole point of the silhouette -->
  <g stroke="#33291a" stroke-linecap="round" fill="none">
    <g id="alJaw">
      <path d="M55 46 C 44 34 38 22 40 8" stroke-width="7"/>
      <path d="M55 46 C 44 34 38 22 40 8" stroke-width="3" stroke="#c0a878"/>
      <!-- inner teeth -->
      <path d="M46 32 L54 30" stroke-width="3"/>
      <path d="M41 20 L50 19" stroke-width="2.8"/>
      <!-- hooked point, curving inward -->
      <path d="M40 8 Q46 3 53 6" stroke-width="4.6"/>
    </g>
    <use href="#alJaw" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- small dark eyes clustered on the head -->
  <g fill="#1e1608">
    <circle cx="57" cy="50" r="2.2"/>
    <circle cx="71" cy="50" r="2.2"/>
    <circle cx="59" cy="55" r="1.3"/>
    <circle cx="69" cy="55" r="1.3"/>
  </g>
  <circle cx="57.7" cy="49.2" r="0.85" fill="#f0e0b8" opacity="0.85"/>
</svg>
