<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Camel Spider (solifuge) — top-down, facing up. Sandy and hairy, dominated by
       the enormous chelicerae: two vertical pairs of shearing jaws that are the
       largest relative to body size of any arachnid. The leg-like pedipalps are held
       forward as feelers, so it reads as ten legs, which is exactly right. -->
  <defs>
    <radialGradient id="sfAbdomen" cx="40%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#f0c894"/>
      <stop offset="52%" stop-color="#d9a066"/>
      <stop offset="100%" stop-color="#6e4419"/>
    </radialGradient>
    <radialGradient id="sfCephalo" cx="40%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#e8b980"/>
      <stop offset="100%" stop-color="#7a4c1c"/>
    </radialGradient>
    <linearGradient id="sfJaw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c3410"/>
      <stop offset="60%" stop-color="#a97434"/>
      <stop offset="100%" stop-color="#e0bb84"/>
    </linearGradient>
  </defs>

  <!-- walking legs -->
  <g fill="none" stroke="#3d2410" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <g id="sfLegs">
      <path d="M50 62 L28 56 L14 62"/>
      <path d="M49 76 L26 76 L12 88"/>
      <path d="M51 90 L30 98 L22 114"/>
    </g>
    <use href="#sfLegs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- pedipalps held forward as feelers -->
  <g fill="none" stroke="#3d2410" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 48 L34 32 L28 14"/>
    <path d="M76 48 L94 32 L100 14"/>
  </g>

  <!-- the leg hairs it is covered in -->
  <g stroke="#5c3a16" stroke-width="1.3" stroke-linecap="round" opacity="0.7">
    <path d="M40 58 L38 52 M32 74 L30 68 M38 94 L34 90"/>
    <path d="M88 58 L90 52 M96 74 L98 68 M90 94 L94 90"/>
  </g>

  <!-- segmented abdomen -->
  <ellipse cx="64" cy="88" rx="19" ry="26" fill="url(#sfAbdomen)" stroke="#3d2410" stroke-width="3.2"/>
  <g fill="none" stroke="#7c5220" stroke-width="1.8" opacity="0.65">
    <path d="M47 76 Q64 81 81 76"/>
    <path d="M46 86 Q64 91 82 86"/>
    <path d="M48 96 Q64 101 80 96"/>
    <path d="M52 106 Q64 110 76 106"/>
  </g>
  <ellipse cx="55" cy="78" rx="5" ry="8" fill="#ffe6bd" opacity="0.3"/>

  <!-- cephalothorax -->
  <ellipse cx="64" cy="52" rx="15" ry="13" fill="url(#sfCephalo)" stroke="#3d2410" stroke-width="3.2"/>

  <!-- the jaws: two enormous shearing chelicerae, held apart mid-shear -->
  <g stroke="#3d2410" stroke-width="2.6" stroke-linejoin="round">
    <path d="M56 44 Q46 30 44 12 Q54 22 60 36 Z" fill="url(#sfJaw)"/>
    <path d="M72 44 Q82 30 84 12 Q74 22 68 36 Z" fill="url(#sfJaw)"/>
  </g>
  <!-- the shearing teeth -->
  <g stroke="#f0dcb8" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M50 26 L55 30 M48 19 L53 23"/>
    <path d="M78 26 L73 30 M80 19 L75 23"/>
  </g>

  <!-- the single close-set median eye pair on the front of the carapace -->
  <circle cx="60" cy="43" r="2.4" fill="#1c0f04"/>
  <circle cx="68" cy="43" r="2.4" fill="#1c0f04"/>
  <circle cx="60.6" cy="42.2" r="0.9" fill="#ffe8c4" opacity="0.8"/>
</svg>
