<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Zombie Ant — top-down, facing up. A grey, drained carpenter ant with the
       Ophiocordyceps stroma erupting from the back of its head: a pale stalk with a
       swollen fruiting body, plus smaller growths splitting the gaster plates.
       The legs are drawn splayed and locked — the fungus parked this body here. -->
  <defs>
    <radialGradient id="zoGaster" cx="42%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#b7c199"/>
      <stop offset="55%" stop-color="#7d8a63"/>
      <stop offset="100%" stop-color="#333a26"/>
    </radialGradient>
    <radialGradient id="zoThorax" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#a9b48c"/>
      <stop offset="100%" stop-color="#454e33"/>
    </radialGradient>
    <radialGradient id="zoHead" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#aeb992"/>
      <stop offset="100%" stop-color="#414a30"/>
    </radialGradient>
    <radialGradient id="zoFruit" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f4f7d8"/>
      <stop offset="60%" stop-color="#cbd89a"/>
      <stop offset="100%" stop-color="#8a9a58"/>
    </radialGradient>
  </defs>

  <!-- legs splayed and stiff, not walking -->
  <g fill="none" stroke="#222a16" stroke-width="3.4" stroke-linecap="round">
    <g id="zoLimbs">
      <path d="M56 56 Q36 50 20 44"/>
      <path d="M56 63 Q34 64 18 68"/>
      <path d="M56 70 Q37 80 24 95"/>
    </g>
    <use href="#zoLimbs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>
  <!-- one antenna broken off -->
  <g fill="none" stroke="#222a16" stroke-width="2.6" stroke-linecap="round">
    <path d="M59 30 Q52 20 48 12"/>
    <path d="M69 30 Q74 24 76 20"/>
  </g>

  <!-- mandibles clamped shut — the fungus makes it bite down and stay -->
  <g fill="none" stroke="#222a16" stroke-width="2.8" stroke-linecap="round">
    <path d="M59 28 Q62 22 63 18"/>
    <path d="M69 28 Q66 22 65 18"/>
  </g>

  <ellipse cx="64" cy="92" rx="14" ry="20" fill="url(#zoGaster)" stroke="#222a16" stroke-width="3"/>
  <ellipse cx="64" cy="61" rx="10" ry="13" fill="url(#zoThorax)" stroke="#222a16" stroke-width="3"/>
  <circle cx="64" cy="38" r="10.5" fill="url(#zoHead)" stroke="#222a16" stroke-width="3"/>

  <!-- split plates with growth pushing out -->
  <path d="M51 85 Q64 91 77 85" fill="none" stroke="#2e3a1c" stroke-width="2" opacity="0.6"/>
  <circle cx="56" cy="96" r="3.4" fill="url(#zoFruit)" stroke="#222a16" stroke-width="1.4"/>
  <circle cx="72" cy="88" r="2.6" fill="url(#zoFruit)" stroke="#222a16" stroke-width="1.2"/>
  <circle cx="68" cy="101" r="2.2" fill="url(#zoFruit)" stroke="#222a16" stroke-width="1.2"/>

  <!-- the stroma: stalk out of the head, club-shaped fruiting body, spores -->
  <path d="M64 34 Q70 22 76 12" fill="none" stroke="#c3d08e" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M64 34 Q70 22 76 12" fill="none" stroke="#8a9a58" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
  <ellipse cx="77" cy="10" rx="6.5" ry="8" fill="url(#zoFruit)" stroke="#5e6b36" stroke-width="1.8" transform="rotate(24 77 10)"/>
  <g fill="#e8f0c0" opacity="0.65">
    <circle cx="88" cy="6" r="1.8"/>
    <circle cx="92" cy="15" r="1.3"/>
    <circle cx="84" cy="19" r="1.1"/>
  </g>

  <!-- clouded, dead eyes -->
  <circle cx="58" cy="38" r="2.4" fill="#cdd6b0"/>
  <circle cx="70" cy="38" r="2.4" fill="#cdd6b0"/>
  <circle cx="58" cy="38" r="1" fill="#5a6440"/>
  <circle cx="70" cy="38" r="1" fill="#5a6440"/>
</svg>
