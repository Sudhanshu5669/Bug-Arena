<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Black Widow — top-down, facing up. Glossy black, a near-spherical abdomen
       carrying the red hourglass, long thin legs with red joint bands, and a sickly
       green necrotic drip at the fangs. -->
  <defs>
    <radialGradient id="wiAbd" cx="38%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#4a3f52"/>
      <stop offset="45%" stop-color="#1c1420"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="wiCeph" cx="40%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#3e3546"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <radialGradient id="wiRot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(140,200,90,0.4)"/>
      <stop offset="100%" stop-color="rgba(140,200,90,0)"/>
    </radialGradient>
  </defs>

  <!-- eight long, fine legs with a pronounced knee bend -->
  <g fill="none" stroke="#0a070d" stroke-width="3" stroke-linecap="round">
    <g id="wiLegs">
      <path d="M54 52 Q32 34 20 16"/>
      <path d="M53 62 Q28 54 10 44"/>
      <path d="M53 72 Q28 76 11 86"/>
      <path d="M55 82 Q34 96 22 114"/>
    </g>
    <use href="#wiLegs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>
  <!-- red joint bands -->
  <g fill="#c0392b" opacity="0.85">
    <circle cx="32" cy="34" r="2"/><circle cx="28" cy="54" r="2"/>
    <circle cx="28" cy="76" r="2"/><circle cx="34" cy="96" r="2"/>
    <circle cx="96" cy="34" r="2"/><circle cx="100" cy="54" r="2"/>
    <circle cx="100" cy="76" r="2"/><circle cx="94" cy="96" r="2"/>
  </g>

  <!-- the big glossy globe of an abdomen -->
  <circle cx="64" cy="84" r="24" fill="url(#wiAbd)" stroke="#000000" stroke-width="3"/>
  <!-- THE HOURGLASS -->
  <path d="M58 74 L70 74 L65 84 L70 94 L58 94 L63 84 Z"
        fill="#c0392b" stroke="#6b1810" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- glossy specular on the shell -->
  <ellipse cx="52" cy="70" rx="7" ry="10" fill="#ffffff" opacity="0.2" transform="rotate(-26 52 70)"/>
  <circle cx="76" cy="96" r="4" fill="#ffffff" opacity="0.08"/>

  <!-- cephalothorax -->
  <ellipse cx="64" cy="50" rx="12" ry="11" fill="url(#wiCeph)" stroke="#000000" stroke-width="2.8"/>

  <!-- pedipalps -->
  <g fill="none" stroke="#0a070d" stroke-width="3.4" stroke-linecap="round">
    <path d="M57 42 Q50 34 48 26"/>
    <path d="M71 42 Q78 34 80 26"/>
  </g>

  <!-- fangs with necrotic venom beading -->
  <circle cx="64" cy="34" r="9" fill="url(#wiRot)"/>
  <g stroke="#0a070d" stroke-linecap="round" fill="none">
    <path d="M60 41 L57 30" stroke-width="4"/>
    <path d="M68 41 L71 30" stroke-width="4"/>
  </g>
  <circle cx="57" cy="28" r="2.2" fill="#8fd05a" opacity="0.9"/>
  <circle cx="71" cy="28" r="2.2" fill="#8fd05a" opacity="0.9"/>
  <circle cx="58" cy="22" r="1.3" fill="#8fd05a" opacity="0.55"/>

  <!-- the eight small eyes -->
  <g fill="#d8d0e0" opacity="0.75">
    <circle cx="60" cy="45" r="1.4"/><circle cx="68" cy="45" r="1.4"/>
    <circle cx="56.5" cy="48" r="1.1"/><circle cx="71.5" cy="48" r="1.1"/>
    <circle cx="62" cy="42" r="1"/><circle cx="66" cy="42" r="1"/>
  </g>
</svg>
