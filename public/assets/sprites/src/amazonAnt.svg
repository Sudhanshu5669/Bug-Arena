<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Amazon Ant — top-down, facing up. Burnished gold raider with the huge
       sabre-shaped mandibles the real species is named for: they can pierce an
       enemy ant's head capsule but are useless for feeding itself. -->
  <defs>
    <radialGradient id="azGaster" cx="42%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="55%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#7a5c0c"/>
    </radialGradient>
    <radialGradient id="azThorax" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#8e6a10"/>
    </radialGradient>
    <radialGradient id="azHead" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffdf7d"/>
      <stop offset="100%" stop-color="#8a660f"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke="#3d2a05" stroke-width="3.5" stroke-linecap="round">
    <g id="azLimbs">
      <path d="M56 55 Q38 46 25 35"/>
      <path d="M56 62 Q36 61 22 62"/>
      <path d="M56 69 Q39 78 28 90"/>
      <path d="M60 33 Q54 22 50 12"/>
    </g>
    <use href="#azLimbs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- sabre mandibles: long, curved, crossing inward at the tips -->
  <g fill="none" stroke="#5a3f08" stroke-width="4" stroke-linecap="round">
    <path d="M57 27 Q46 17 42 6 Q50 12 58 18"/>
    <path d="M71 27 Q82 17 86 6 Q78 12 70 18"/>
  </g>

  <ellipse cx="64" cy="92" rx="15" ry="20" fill="url(#azGaster)" stroke="#3d2a05" stroke-width="3"/>
  <ellipse cx="64" cy="61" rx="11" ry="13" fill="url(#azThorax)" stroke="#3d2a05" stroke-width="3"/>
  <circle cx="64" cy="37" r="11" fill="url(#azHead)" stroke="#3d2a05" stroke-width="3"/>

  <!-- plunder-scarred plating -->
  <path d="M50 84 Q64 90 78 84" fill="none" stroke="#6b4e08" stroke-width="2" opacity="0.6"/>
  <path d="M52 100 Q64 105 76 100" fill="none" stroke="#6b4e08" stroke-width="2" opacity="0.55"/>
  <ellipse cx="58" cy="84" rx="5" ry="7" fill="#fff3c4" opacity="0.4"/>

  <circle cx="58" cy="37" r="2.4" fill="#2b1d02"/>
  <circle cx="70" cy="37" r="2.4" fill="#2b1d02"/>
  <circle cx="59" cy="36" r="0.9" fill="#fff0c0" opacity="0.85"/>
</svg>
