<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Queen Ant — top-down, facing up. Royal purple, vastly larger than a worker,
       with the vestigial wing stubs of a mated queen, a small gold crown crest, and
       a huge egg-laden abdomen with brood visible through the shell. -->
  <defs>
    <radialGradient id="quGaster" cx="40%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#c77fe0"/>
      <stop offset="48%" stop-color="#8d3fb0"/>
      <stop offset="100%" stop-color="#2c0d3d"/>
    </radialGradient>
    <radialGradient id="quBody" cx="42%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#a95cc8"/>
      <stop offset="100%" stop-color="#2a0b3a"/>
    </radialGradient>
    <linearGradient id="quWing" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(235,220,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(180,150,215,0.14)"/>
    </linearGradient>
    <radialGradient id="quGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(200,120,235,0.3)"/>
      <stop offset="100%" stop-color="rgba(200,120,235,0)"/>
    </radialGradient>
  </defs>

  <!-- regal aura -->
  <circle cx="64" cy="84" r="44" fill="url(#quGlow)"/>

  <!-- vestigial wing stubs (she shed her wings after the nuptial flight) -->
  <g stroke="#6a3a86" stroke-width="1.4">
    <ellipse cx="42" cy="58" rx="15" ry="6" fill="url(#quWing)" transform="rotate(-32 42 58)"/>
    <ellipse cx="86" cy="58" rx="15" ry="6" fill="url(#quWing)" transform="rotate(32 86 58)"/>
  </g>

  <!-- heavy legs -->
  <g fill="none" stroke="#2c0d3d" stroke-width="4" stroke-linecap="round">
    <g id="quLimbs">
      <path d="M54 56 Q34 48 20 38"/>
      <path d="M54 66 Q32 66 17 67"/>
      <path d="M55 76 Q36 87 25 100"/>
      <path d="M58 34 Q50 24 45 15"/>
    </g>
    <use href="#quLimbs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- THE ABDOMEN: enormous and full of brood -->
  <ellipse cx="64" cy="90" rx="24" ry="30" fill="url(#quGaster)" stroke="#2c0d3d" stroke-width="3.6"/>
  <!-- segment cinches -->
  <g fill="none" stroke="#3d1553" stroke-width="2.4" opacity="0.6">
    <path d="M42 80 Q64 89 86 80"/>
    <path d="M43 94 Q64 103 85 94"/>
    <path d="M49 107 Q64 114 79 107"/>
  </g>
  <!-- eggs visible through the shell -->
  <g fill="#f2e4ff" opacity="0.55">
    <ellipse cx="55" cy="84" rx="4" ry="5.6" transform="rotate(-18 55 84)"/>
    <ellipse cx="72" cy="90" rx="3.6" ry="5" transform="rotate(14 72 90)"/>
    <ellipse cx="62" cy="100" rx="3.2" ry="4.4"/>
  </g>
  <ellipse cx="52" cy="76" rx="7" ry="10" fill="#ffffff" opacity="0.16" transform="rotate(-22 52 76)"/>

  <!-- thorax + head -->
  <ellipse cx="64" cy="53" rx="13" ry="12" fill="url(#quBody)" stroke="#2c0d3d" stroke-width="3.4"/>
  <ellipse cx="64" cy="32" rx="11" ry="10" fill="url(#quBody)" stroke="#2c0d3d" stroke-width="3.2"/>

  <!-- the crown crest -->
  <path d="M55 24 L58 15 L61 21 L64 11 L67 21 L70 15 L73 24 Z"
        fill="#f2c53d" stroke="#8a6a10" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="64" cy="17" r="1.6" fill="#fff4c0"/>

  <!-- mandibles -->
  <g fill="none" stroke="#2c0d3d" stroke-width="3" stroke-linecap="round">
    <path d="M58 26 Q54 21 55 17"/>
    <path d="M70 26 Q74 21 73 17"/>
  </g>

  <!-- eyes -->
  <ellipse cx="58" cy="32" rx="2.8" ry="3.4" fill="#180520"/>
  <ellipse cx="70" cy="32" rx="2.8" ry="3.4" fill="#180520"/>
  <circle cx="58.8" cy="31" r="1" fill="#f0d8ff" opacity="0.85"/>
</svg>
