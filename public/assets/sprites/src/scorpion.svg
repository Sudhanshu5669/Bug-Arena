<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Scorpion — top-down, facing up. Pincers reach forward; the segmented tail
       curls up and over, stinger poised. Source art; rendered directly from SVG. -->
  <defs>
    <radialGradient id="scoBody" cx="42%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#e6bd63"/>
      <stop offset="52%" stop-color="#b5892b"/>
      <stop offset="100%" stop-color="#6f521a"/>
    </radialGradient>
    <radialGradient id="scoClaw" cx="40%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#d9ad55"/>
      <stop offset="100%" stop-color="#7a5a1a"/>
    </radialGradient>
  </defs>

  <!-- eight legs, splayed low under the body -->
  <g fill="none" stroke="#4a3410" stroke-width="3.6" stroke-linecap="round">
    <g id="scoLegs">
      <path d="M53 54 Q33 47 22 38"/>
      <path d="M53 61 Q32 59 20 57"/>
      <path d="M53 68 Q33 72 22 80"/>
      <path d="M53 75 Q35 84 26 94"/>
    </g>
    <use href="#scoLegs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- body: cephalothorax + a tapering, segmented abdomen -->
  <ellipse cx="64" cy="56" rx="14" ry="13" fill="url(#scoBody)" stroke="#4a3410" stroke-width="3.4"/>
  <ellipse cx="64" cy="71" rx="12" ry="11" fill="url(#scoBody)" stroke="#4a3410" stroke-width="3.2"/>
  <ellipse cx="64" cy="84" rx="10" ry="9.5" fill="url(#scoBody)" stroke="#4a3410" stroke-width="3"/>
  <ellipse cx="64" cy="95" rx="8.2" ry="8" fill="url(#scoBody)" stroke="#4a3410" stroke-width="2.8"/>
  <!-- segment cinches -->
  <path d="M53 63 Q64 68 75 63" fill="none" stroke="#5a4014" stroke-width="1.8" opacity="0.5"/>
  <path d="M55 77 Q64 82 73 77" fill="none" stroke="#5a4014" stroke-width="1.6" opacity="0.5"/>

  <!-- pincer arms (pedipalps) reaching forward -->
  <g stroke="#4a3410" stroke-linecap="round" fill="url(#scoClaw)">
    <g id="scoArm">
      <!-- upper + fore arm -->
      <path d="M55 50 L48 39 L45 31" fill="none" stroke-width="6"/>
      <!-- claw hand -->
      <ellipse cx="43" cy="29" rx="7" ry="8.5" stroke-width="2.6"/>
      <!-- two pincer fingers -->
      <path d="M39 23 Q36 15 40 10" fill="none" stroke-width="3.4"/>
      <path d="M47 24 Q50 16 46 11" fill="none" stroke-width="3.4"/>
    </g>
    <use href="#scoArm" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- eyes -->
  <circle cx="61" cy="50" r="2" fill="#241703"/>
  <circle cx="67" cy="50" r="2" fill="#241703"/>
  <circle cx="61.6" cy="49.3" r="0.8" fill="#ffe6a8" opacity="0.85"/>

  <!-- tail (metasoma): curls up the right side and over, stinger poised forward -->
  <path d="M64 99 C 80 96 91 86 89 70 C 87 55 78 47 69 45" fill="none" stroke="#4a3410" stroke-width="11" stroke-linecap="round"/>
  <path d="M64 99 C 80 96 91 86 89 70 C 87 55 78 47 69 45" fill="none" stroke="#b5892b" stroke-width="7.5" stroke-linecap="round"/>
  <g fill="url(#scoBody)" stroke="#4a3410" stroke-width="2">
    <circle cx="72" cy="97" r="5.6"/>
    <circle cx="82" cy="89" r="5.2"/>
    <circle cx="88" cy="78" r="4.8"/>
    <circle cx="88" cy="66" r="4.4"/>
    <circle cx="82" cy="55" r="4.1"/>
    <circle cx="74" cy="48" r="3.8"/>
  </g>
  <!-- stinger bulb + barb -->
  <ellipse cx="69" cy="45" rx="5" ry="6.2" fill="#8a6a24" stroke="#4a3410" stroke-width="2"/>
  <path d="M69 40 L64 31 L74 34 Z" fill="#3a2a0c" stroke="#4a3410" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
