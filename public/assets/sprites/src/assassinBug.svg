<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Assassin Bug — top-down, facing up. Blood-red and narrow, with the long
       curved proboscis (rostrum) tucked under the head, raptorial front legs held
       up ready to grab, and a banded flared abdomen. -->
  <defs>
    <radialGradient id="asAbd" cx="40%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#e04a70"/>
      <stop offset="50%" stop-color="#a01b3f"/>
      <stop offset="100%" stop-color="#360510"/>
    </radialGradient>
    <radialGradient id="asBody" cx="42%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#b8304c"/>
      <stop offset="100%" stop-color="#2c0410"/>
    </radialGradient>
  </defs>

  <!-- rear + middle legs, long and spindly -->
  <g fill="none" stroke="#2c0410" stroke-width="3" stroke-linecap="round">
    <g id="asLegs">
      <path d="M55 70 Q34 72 20 66"/>
      <path d="M56 82 Q38 92 28 106"/>
    </g>
    <use href="#asLegs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- RAPTORIAL FORELEGS: folded and raised, ready to seize -->
  <g fill="none" stroke="#2c0410" stroke-linecap="round">
    <g id="asRaptor">
      <path d="M55 52 L38 40 L30 22" stroke-width="5.4"/>
      <path d="M55 52 L38 40 L30 22" stroke-width="2.2" stroke="#c24a62"/>
      <!-- grasping spines -->
      <path d="M36 36 L31 33" stroke-width="2"/>
      <path d="M33 30 L28 28" stroke-width="2"/>
      <path d="M30 22 L26 16" stroke-width="2.6"/>
    </g>
    <use href="#asRaptor" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- abdomen: flared, with the banded margin real assassin bugs show -->
  <path d="M64 60 C 82 64 90 82 86 100 C 82 114 72 120 64 120 C 56 120 46 114 42 100 C 38 82 46 64 64 60 Z"
        fill="url(#asAbd)" stroke="#2c0410" stroke-width="3.2"/>
  <g fill="#f0c0c8" opacity="0.35">
    <path d="M42 92 L48 92 L48 100 L43 100 Z"/>
    <path d="M86 92 L80 92 L80 100 L85 100 Z"/>
    <path d="M45 104 L51 104 L50 111 L46 110 Z"/>
    <path d="M83 104 L77 104 L78 111 L82 110 Z"/>
  </g>
  <path d="M64 62 L64 118" fill="none" stroke="#2c0410" stroke-width="2" opacity="0.55"/>
  <ellipse cx="53" cy="76" rx="5" ry="8" fill="#ffffff" opacity="0.14" transform="rotate(-20 53 76)"/>

  <!-- thorax + narrow head -->
  <ellipse cx="64" cy="50" rx="10" ry="11" fill="url(#asBody)" stroke="#2c0410" stroke-width="3"/>
  <ellipse cx="64" cy="32" rx="7" ry="8.5" fill="url(#asBody)" stroke="#2c0410" stroke-width="2.8"/>

  <!-- THE PROBOSCIS: a curved, segmented beak tucked under the head -->
  <path d="M64 26 C 62 16 63 8 67 2" fill="none" stroke="#2c0410" stroke-width="5"/>
  <path d="M64 26 C 62 16 63 8 67 2" fill="none" stroke="#d05a72" stroke-width="2" />
  <circle cx="67" cy="3" r="2" fill="#7a0f22"/>

  <!-- antennae, long and thin -->
  <g fill="none" stroke="#2c0410" stroke-width="2" stroke-linecap="round">
    <path d="M59 27 Q48 16 44 4"/>
    <path d="M69 27 Q80 16 84 4"/>
  </g>

  <!-- bulging eyes set wide on the narrow head -->
  <circle cx="57" cy="31" r="3.2" fill="#1a0208"/>
  <circle cx="71" cy="31" r="3.2" fill="#1a0208"/>
  <circle cx="56" cy="29.8" r="1.1" fill="#ffc8d0" opacity="0.85"/>
</svg>
