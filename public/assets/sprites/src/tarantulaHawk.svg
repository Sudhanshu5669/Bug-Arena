<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Tarantula Hawk — top-down, facing up. Blue-black metallic body with the
       unmistakable rust-orange wings, long hooked legs for dragging a paralysed
       spider, and a heavy curved sting at the tip. -->
  <defs>
    <radialGradient id="thkBody" cx="42%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#3a3a63"/>
      <stop offset="55%" stop-color="#1b1b2f"/>
      <stop offset="100%" stop-color="#07070f"/>
    </radialGradient>
    <radialGradient id="thkThorax" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#454570"/>
      <stop offset="100%" stop-color="#12121f"/>
    </radialGradient>
    <linearGradient id="thkWing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9d3c" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#d9601a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8a3208" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- long hooked legs, built for hauling -->
  <g fill="none" stroke="#0a0a14" stroke-width="3.6" stroke-linecap="round">
    <g id="thkLimbs">
      <path d="M56 52 Q34 44 18 30 Q24 36 22 42"/>
      <path d="M56 62 Q32 62 14 62 Q22 66 22 72"/>
      <path d="M57 72 Q38 84 24 100 Q32 96 38 100"/>
      <path d="M60 32 Q52 18 47 6"/>
    </g>
    <use href="#thkLimbs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- rust wings, swept back over the abdomen -->
  <g stroke="#5e2205" stroke-width="1.6">
    <ellipse cx="44" cy="76" rx="10" ry="27" fill="url(#thkWing)" transform="rotate(19 44 76)"/>
    <ellipse cx="84" cy="76" rx="10" ry="27" fill="url(#thkWing)" transform="rotate(-19 84 76)"/>
  </g>
  <g fill="none" stroke="#7a3a10" stroke-width="1" opacity="0.5">
    <path d="M40 56 Q42 76 46 96"/>
    <path d="M88 56 Q86 76 82 96"/>
  </g>

  <!-- body: abdomen, thorax, head -->
  <ellipse cx="64" cy="88" rx="12" ry="21" fill="url(#thkBody)" stroke="#0a0a14" stroke-width="3"/>
  <ellipse cx="64" cy="57" rx="11" ry="14" fill="url(#thkThorax)" stroke="#0a0a14" stroke-width="3"/>
  <circle cx="64" cy="34" r="11" fill="url(#thkBody)" stroke="#0a0a14" stroke-width="3"/>

  <!-- the sting -->
  <path d="M64 108 Q68 118 63 126" fill="none" stroke="#1b1b2f" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M64 108 Q68 118 63 126" fill="none" stroke="#ff9d3c" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

  <!-- abdominal banding + metallic sheen -->
  <path d="M53 80 Q64 86 75 80" fill="none" stroke="#4a4a80" stroke-width="2" opacity="0.55"/>
  <path d="M54 95 Q64 100 74 95" fill="none" stroke="#4a4a80" stroke-width="2" opacity="0.45"/>
  <ellipse cx="58" cy="79" rx="4" ry="6" fill="#8f8fd0" opacity="0.28"/>

  <!-- big compound eyes -->
  <ellipse cx="56" cy="33" rx="3.4" ry="4.6" fill="#0b0b12" stroke="#43436e" stroke-width="1.2"/>
  <ellipse cx="72" cy="33" rx="3.4" ry="4.6" fill="#0b0b12" stroke="#43436e" stroke-width="1.2"/>
  <circle cx="57" cy="31" r="1.1" fill="#c9c9f0" opacity="0.7"/>
</svg>
