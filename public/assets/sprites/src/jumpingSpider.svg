<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Jumping Spider — top-down, facing up. Compact and fuzzy, with the front pair
       of legs raised and the enormous forward-facing anterior median eyes that give
       it the best vision of any arthropod. Drawn crouched, ready to spring. -->
  <defs>
    <radialGradient id="jsAbdomen" cx="40%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#7a7fa8"/>
      <stop offset="52%" stop-color="#4a4e69"/>
      <stop offset="100%" stop-color="#191c2e"/>
    </radialGradient>
    <radialGradient id="jsCephalo" cx="40%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#6b7096"/>
      <stop offset="100%" stop-color="#22253a"/>
    </radialGradient>
    <radialGradient id="jsEye" cx="34%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#3ad6c8"/>
      <stop offset="100%" stop-color="#0a2f2c"/>
    </radialGradient>
  </defs>

  <!-- back three leg pairs, folded and coiled under the body -->
  <g fill="none" stroke="#16182b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <g id="jsLegs">
      <path d="M50 66 L30 62 L20 74"/>
      <path d="M50 80 L28 82 L20 96"/>
      <path d="M52 92 L34 102 L30 116"/>
    </g>
    <use href="#jsLegs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- front pair raised and held out — the classic jumping-spider pose -->
  <g fill="none" stroke="#16182b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 50 L36 34 L40 16"/>
    <path d="M76 50 L92 34 L88 16"/>
  </g>
  <g fill="none" stroke="#6b7096" stroke-width="1.8" stroke-linecap="round">
    <path d="M52 50 L36 34 L40 16"/>
    <path d="M76 50 L92 34 L88 16"/>
  </g>

  <!-- abdomen with the pale chevron markings of many salticids -->
  <ellipse cx="64" cy="88" rx="19" ry="24" fill="url(#jsAbdomen)" stroke="#16182b" stroke-width="3.2"/>
  <g fill="#d8dcf0" opacity="0.35">
    <path d="M50 78 Q64 84 78 78 Q64 88 50 78 Z"/>
    <path d="M53 92 Q64 97 75 92 Q64 100 53 92 Z"/>
    <path d="M56 104 Q64 108 72 104 Q64 110 56 104 Z"/>
  </g>
  <ellipse cx="55" cy="78" rx="5" ry="7" fill="#b8bee0" opacity="0.25"/>

  <!-- cephalothorax: squared-off at the front, where the eyes live -->
  <path d="M46 52 Q46 32 64 30 Q82 32 82 52 Q82 64 64 66 Q46 64 46 52 Z"
        fill="url(#jsCephalo)" stroke="#16182b" stroke-width="3.2"/>

  <!-- the two huge forward eyes, plus the smaller secondary pairs -->
  <circle cx="55" cy="40" r="7.5" fill="url(#jsEye)" stroke="#16182b" stroke-width="2"/>
  <circle cx="73" cy="40" r="7.5" fill="url(#jsEye)" stroke="#16182b" stroke-width="2"/>
  <circle cx="52.5" cy="37" r="2.4" fill="#ffffff" opacity="0.85"/>
  <circle cx="70.5" cy="37" r="2.4" fill="#ffffff" opacity="0.85"/>
  <g fill="#0d1020">
    <circle cx="46" cy="35" r="2.6"/>
    <circle cx="82" cy="35" r="2.6"/>
    <circle cx="50" cy="50" r="2"/>
    <circle cx="78" cy="50" r="2"/>
  </g>

  <!-- chelicerae -->
  <g stroke="#16182b" stroke-width="3.4" stroke-linecap="round">
    <path d="M58 28 L55 20"/>
    <path d="M70 28 L73 20"/>
  </g>
</svg>
