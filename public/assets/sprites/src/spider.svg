<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Web Spider — top-down, facing up. Source art; rasterized to spider.png. -->
  <defs>
    <radialGradient id="spiderAbd" cx="42%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#c9a0f5"/>
      <stop offset="55%" stop-color="#9b5de5"/>
      <stop offset="100%" stop-color="#4a1f8f"/>
    </radialGradient>
    <radialGradient id="spiderCeph" cx="42%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#b98cf0"/>
      <stop offset="100%" stop-color="#5a2aa0"/>
    </radialGradient>
  </defs>

  <!-- 8 legs with knees (drawn under the body) -->
  <g fill="none" stroke="#2e1450" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <g id="spiderLegs">
      <path d="M60 50 L34 32 L22 22"/>
      <path d="M62 55 L32 48 L18 45"/>
      <path d="M62 61 L32 66 L19 73"/>
      <path d="M60 67 L36 82 L26 98"/>
    </g>
    <use href="#spiderLegs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- pedipalps -->
  <g fill="none" stroke="#2e1450" stroke-width="3" stroke-linecap="round">
    <path d="M59 46 Q52 40 47 34"/>
    <path d="M69 46 Q76 40 81 34"/>
  </g>

  <!-- abdomen + cephalothorax -->
  <ellipse cx="64" cy="86" rx="21" ry="23" fill="url(#spiderAbd)" stroke="#2e1450" stroke-width="3"/>
  <ellipse cx="64" cy="53" rx="14" ry="15" fill="url(#spiderCeph)" stroke="#2e1450" stroke-width="3"/>

  <!-- abdomen marking (hourglass) + sheen -->
  <path d="M64 72 L58 84 L64 96 L70 84 Z" fill="#3a1a6e" opacity="0.55"/>
  <ellipse cx="57" cy="77" rx="6" ry="9" fill="#d8c2ff" opacity="0.35"/>

  <!-- eye cluster -->
  <g fill="#1c0d38">
    <circle cx="59" cy="45" r="2.1"/>
    <circle cx="69" cy="45" r="2.1"/>
    <circle cx="62" cy="48" r="1.6"/>
    <circle cx="66" cy="48" r="1.6"/>
  </g>
  <circle cx="59" cy="44.3" r="0.8" fill="#e6d6ff" opacity="0.8"/>
</svg>
