<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Hornet — top-down, facing up. Four translucent wings swept back mid-hover, a
       wasp-waisted yellow-and-black abdomen, and a long exposed sting. Everything
       about the shape is meant to read "fast and sharp", not "armoured". -->
  <defs>
    <radialGradient id="hoAbd" cx="42%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#ffe776"/>
      <stop offset="50%" stop-color="#f2c012"/>
      <stop offset="100%" stop-color="#8a6402"/>
    </radialGradient>
    <radialGradient id="hoThorax" cx="42%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#6a5a24"/>
      <stop offset="100%" stop-color="#1d1704"/>
    </radialGradient>
    <radialGradient id="hoHead" cx="40%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#f7d64a"/>
      <stop offset="100%" stop-color="#7a5a06"/>
    </radialGradient>
    <linearGradient id="hoWing" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(226,238,255,0.62)"/>
      <stop offset="100%" stop-color="rgba(150,180,225,0.18)"/>
    </linearGradient>
  </defs>

  <!-- WINGS: drawn first so the body sits over them. Swept back, blurred by hover. -->
  <g stroke="#cfe0f5" stroke-width="1.2" opacity="0.85">
    <g id="hoWings">
      <ellipse cx="34" cy="66" rx="26" ry="9" fill="url(#hoWing)" transform="rotate(-26 34 66)"/>
      <ellipse cx="38" cy="82" rx="19" ry="6.5" fill="url(#hoWing)" transform="rotate(-12 38 82)"/>
      <!-- wing veins -->
      <path d="M14 76 Q34 62 58 60" fill="none" stroke="#b9cfe8" stroke-width="0.9" opacity="0.7"/>
    </g>
    <use href="#hoWings" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- legs, tucked and trailing the way a hornet carries them in flight -->
  <g fill="none" stroke="#2b2205" stroke-width="2.8" stroke-linecap="round">
    <g id="hoLegs">
      <path d="M56 58 Q42 62 34 72"/>
      <path d="M56 66 Q44 74 39 86"/>
      <path d="M57 74 Q48 86 45 98"/>
    </g>
    <use href="#hoLegs" transform="matrix(-1 0 0 1 128 0)"/>
  </g>

  <!-- abdomen: banded, tapering to the sting -->
  <ellipse cx="64" cy="88" rx="13" ry="21" fill="url(#hoAbd)" stroke="#2b2205" stroke-width="3.2"/>
  <g fill="#241c03" opacity="0.92">
    <path d="M52 80 Q64 86 76 80 L76 86 Q64 92 52 86 Z"/>
    <path d="M54 94 Q64 100 74 94 L74 100 Q64 105 54 100 Z"/>
  </g>
  <ellipse cx="57" cy="79" rx="4" ry="6" fill="#fff6c8" opacity="0.35"/>

  <!-- the wasp waist (petiole) -->
  <rect x="60.5" y="62" width="7" height="9" rx="3" fill="url(#hoThorax)" stroke="#2b2205" stroke-width="2.4"/>

  <!-- the sting: long, exposed, with a venom bead -->
  <path d="M64 109 L61 120 L64 127 L67 120 Z" fill="#1a1403" stroke="#2b2205" stroke-width="1.4"/>
  <circle cx="64" cy="122" r="1.8" fill="#c8ff6a" opacity="0.8"/>

  <!-- thorax -->
  <ellipse cx="64" cy="55" rx="12.5" ry="11" fill="url(#hoThorax)" stroke="#2b2205" stroke-width="3.2"/>

  <!-- head, with the broad wasp face -->
  <ellipse cx="64" cy="36" rx="11" ry="9.5" fill="url(#hoHead)" stroke="#2b2205" stroke-width="3"/>

  <!-- antennae, elbowed forward -->
  <g fill="none" stroke="#2b2205" stroke-width="2.6" stroke-linecap="round">
    <path d="M58 29 Q52 20 54 11"/>
    <path d="M70 29 Q76 20 74 11"/>
  </g>

  <!-- mandibles -->
  <g fill="none" stroke="#2b2205" stroke-width="2.6" stroke-linecap="round">
    <path d="M59 29 Q57 24 59 21"/>
    <path d="M69 29 Q71 24 69 21"/>
  </g>

  <!-- big compound eyes wrapping the head — the predatory tell -->
  <ellipse cx="56" cy="35" rx="4" ry="6" fill="#241c03" transform="rotate(14 56 35)"/>
  <ellipse cx="72" cy="35" rx="4" ry="6" fill="#241c03" transform="rotate(-14 72 35)"/>
  <circle cx="55" cy="32.5" r="1.3" fill="#fff2b0" opacity="0.8"/>
  <!-- ocelli -->
  <circle cx="64" cy="29" r="1.2" fill="#3a2d05"/>
</svg>
